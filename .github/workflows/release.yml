name: Release

on:
  push:
    branches:
      - master

jobs:
  bump_version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
    concurrency:
      group: npm-release-master
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Bump package version (patch)
        id: bump_version
        shell: bash
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          yarn version --patch --no-git-tag-version
          NEXT_VERSION="$(node -p "require('./package.json').version")"
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "next_version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push bumped version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to v${{ steps.bump_version.outputs.next_version }}"
          git push

      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api
          --method POST
          -H "Accept: application/vnd.github+json"
          /repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches
          -f ref=master
          -f inputs[version]=${{ steps.bump_version.outputs.next_version }}
